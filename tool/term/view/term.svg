
<svg width="2048" height="2048" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Violet rounded-square icon (3D extruded)</title>
<desc>App icon with recessed zinc well and a single protruding violet rounded-square with soft glow.</desc>

<defs>
<radialGradient id="well" cx="50%" cy="42%" r="70%">
<stop offset="0%" stop-color="#27272a"/>
<stop offset="65%" stop-color="#18181b"/>
<stop offset="100%" stop-color="#09090b"/>
</radialGradient>

<linearGradient id="wellRim" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
<stop offset="50%" stop-color="#000000" stop-opacity="0"/>
<stop offset="100%" stop-color="#3f3f46" stop-opacity="0.55"/>
</linearGradient>

<linearGradient id="bezelBody" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#26262a"/>
<stop offset="50%" stop-color="#1f1f23"/>
<stop offset="100%" stop-color="#212125"/>
</linearGradient>

<linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#52525b" stop-opacity="0.25"/>
<stop offset="40%" stop-color="#52525b" stop-opacity="0"/>
</linearGradient>

<linearGradient id="discBevel" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
<stop offset="20%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
<feOffset dx="0" dy="3" result="offsetblur"/>
<feFlood flood-color="#000000" flood-opacity="0.95"/>
<feComposite in2="offsetblur" operator="in"/>
<feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
<feMerge>
<feMergeNode in="SourceGraphic"/>
<feMergeNode in="shadowDiff"/>
</feMerge>
</filter>

<filter id="violetGlow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="22"/>
</filter>

<filter id="discDropShadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
<feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.55"/>
</filter>
</defs>

<rect x="0" y="0" width="240" height="240" rx="54" fill="url(#bezelBody)"/>
<rect x="0" y="0" width="240" height="240" rx="54" fill="url(#topHighlight)"/>

<rect x="21" y="21" width="198" height="198" rx="39" fill="url(#well)" filter="url(#innerShadow)"/>
<rect x="21" y="21" width="198" height="198" rx="39" fill="url(#wellRim)" opacity="0.6"/>

<!-- Soft violet glow halo -->
<rect x="64.5" y="64.5" width="111" height="111" rx="22" fill="#8b5cf6" opacity="0.32" filter="url(#violetGlow)"/>

<!-- Protruding violet disc: layered shadow + bevel -->
<rect x="73.5" y="73.5" width="93" height="93" rx="17" fill="#8b5cf6" filter="url(#discDropShadow)"/>
<rect x="73.5" y="73.5" width="93" height="93" rx="17" fill="url(#discBevel)"/>
</svg>
