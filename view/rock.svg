<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Violet caret icon</title>
<desc>App icon with recessed zinc well, flat matte violet disc with soft glow, and an etched rectangular caret.</desc>

<defs>
<radialGradient id="well" cx="50%" cy="42%" r="70%">
<stop offset="0%" stop-color="#27272a"/>
<stop offset="65%" stop-color="#18181b"/>
<stop offset="100%" stop-color="#09090b"/>
</radialGradient>

<linearGradient id="wellRim" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
<stop offset="50%" stop-color="#000000" stop-opacity="0"/>
<stop offset="100%" stop-color="#3f3f46" stop-opacity="0.55"/>
</linearGradient>

<linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#52525b" stop-opacity="0.4"/>
<stop offset="40%" stop-color="#52525b" stop-opacity="0"/>
</linearGradient>

<linearGradient id="caretFill" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#d4d4d8"/>
<stop offset="35%" stop-color="#fafafa"/>
<stop offset="100%" stop-color="#fafafa"/>
</linearGradient>

<filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
<feOffset dx="0" dy="3" result="offsetblur"/>
<feFlood flood-color="#000000" flood-opacity="0.95"/>
<feComposite in2="offsetblur" operator="in"/>
<feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
<feMerge>
<feMergeNode in="SourceGraphic"/>
<feMergeNode in="shadowDiff"/>
</feMerge>
</filter>

<filter id="discInset" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
<feOffset dx="0" dy="1.5" result="offsetblur"/>
<feFlood flood-color="#000000" flood-opacity="0.7"/>
<feComposite in2="offsetblur" operator="in"/>
<feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
<feMerge>
<feMergeNode in="SourceGraphic"/>
<feMergeNode in="shadowDiff"/>
</feMerge>
</filter>

<filter id="violetGlow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="10"/>
</filter>

<filter id="violetGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="14"/>
</filter>
</defs>

<rect x="0" y="0" width="240" height="240" rx="54" fill="#18181b"/>
<rect x="0" y="0" width="240" height="240" rx="54" fill="url(#topHighlight)"/>

<rect x="21" y="21" width="198" height="198" rx="39" fill="url(#well)" filter="url(#innerShadow)"/>
<rect x="21" y="21" width="198" height="198" rx="39" fill="url(#wellRim)" opacity="0.6"/>

<circle cx="120" cy="120" r="58" fill="#8b5cf6" opacity="0.45" filter="url(#violetGlow)"/>
<circle cx="120" cy="120" r="48" fill="#a78bfa" opacity="0.35" filter="url(#violetGlowSoft)"/>

<circle cx="120" cy="120" r="45" fill="#8b5cf6" filter="url(#discInset)"/>

<rect x="115" y="99" width="10" height="42" fill="url(#caretFill)"/>
<rect x="115" y="99" width="10" height="1.6" fill="#000000" opacity="0.5"/>
<rect x="115" y="139.4" width="10" height="1.6" fill="#000000" opacity="0.22"/>
</svg>
