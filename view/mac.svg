<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Palette: Tailwind zinc
      zinc-50  #fafafa   zinc-100 #f4f4f5   zinc-200 #e4e4e7
      zinc-300 #d4d4d8   zinc-400 #a1a1aa   zinc-500 #71717a
      zinc-600 #52525b   zinc-700 #3f3f46   zinc-800 #27272a
      zinc-900 #18181b   zinc-950 #09090b
  -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#27272a"/>
      <stop offset="0.55" stop-color="#18181b"/>
      <stop offset="1"    stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glassSweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#fafafa" stop-opacity="0.18"/>
      <stop offset="0.18" stop-color="#fafafa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="dotGrad" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0"    stop-color="#fafafa"/>
      <stop offset="0.75" stop-color="#f4f4f5"/>
      <stop offset="1"    stop-color="#d4d4d8"/>
    </radialGradient>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="22" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect x="62" y="62" width="900" height="900" rx="210" ry="210"/>
    </clipPath>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="62" y="62" width="900" height="900" rx="210" ry="210" fill="url(#bodyGrad)"/>
    <g clip-path="url(#squircleClip)">
      <path d="M 62 62 L 962 62 Q 720 540, 62 760 Z" fill="url(#glassSweep)" opacity="0.95"/>
      <rect x="62" y="62" width="900" height="220" fill="url(#topSheen)"/>
      <rect x="62" y="600" width="900" height="362" fill="url(#bottomLift)"/>
      <path d="M 62 62 Q 360 240, 620 360 Q 360 300, 62 360 Z" fill="#fafafa" opacity="0.025"/>
    </g>
    <rect x="62.5" y="62.5" width="899" height="899" rx="210" ry="210"
          fill="none" stroke="#fafafa" stroke-opacity="0.07" stroke-width="1"/>
    <rect x="62" y="62" width="900" height="900" rx="210" ry="210"
          fill="none" stroke="#09090b" stroke-opacity="0.6" stroke-width="2"/>
    <g filter="url(#dotShadow)">
      <circle cx="512" cy="512" r="138" fill="url(#dotGrad)"/>
    </g>
  </g>
</svg>
